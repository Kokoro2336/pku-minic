[workspace]
members = [
    "crates/kaguya",
    "crates/iroha",
    "crates/yachiyo",
]
resolver = "2"

[toolchain]
channel = "1.85.0"

[workspace.dependencies]
# for hashing
rustc-hash = "2.1.1"

# Cli support
clap = { version = "4.4.18", features = ["derive"] }
clap_builder = "4.4.18"
clap_derive = "4.4.7"
clap_lex = "1.1.0"
