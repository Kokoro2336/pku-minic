[package]
name = "yachiyo"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
rustc-hash = { workspace = true }

# Generating enums
strum = "0.28"
strum_macros = "0.28"

# logging
tracing = { version = "0.1.37", optional = true }
tracing-subscriber = { version = "0.3.17", features = ["fmt", "env-filter"], optional = true }
tracing-appender = { version = "0.2.1", optional = true }

# for printing graphs
graphviz-rust = "0.9.6"

# Cli
clap = { workspace = true }
clap_builder = { workspace = true }
clap_derive = { workspace = true }
clap_lex = { workspace = true }

[features]
debug = ["tracing", "tracing-subscriber", "tracing-appender"]
