[package]
name = "iroha"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "compiler"
path = "src/main.rs"

[build-dependencies]
lalrpop = "0.22.2"

[dependencies]
yachiyo = { path = "../yachiyo" }
lalrpop-util = { version = "0.22.2", features = ["lexer"] }
clap = { version = "4.4.18", features = ["derive"] }
clap_builder = "4.4.18"
clap_derive = "4.4.7"
clap_lex = "1.1.0"
libc = "0.2"
chrono = "0.4.41"
textwrap = "0.16.2"
tool = "0.2.1"
regex = "1.11.0"
rustc-hash = { workspace = true }
